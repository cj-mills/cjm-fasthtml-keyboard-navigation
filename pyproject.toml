[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cjm-fasthtml-keyboard-navigation"
dynamic = ["version"]
description = "A declarative keyboard navigation framework for FastHTML applications with multi-zone focus management, mode switching, and HTMX integration."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Christian J. Mills", email = "9126128+cj-mills@users.noreply.github.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['python-fasthtml==0.13.4', 'cjm_fasthtml_tailwind', 'cjm_fasthtml_daisyui', 'cjm_fasthtml_lucide_icons', 'cjm_fasthtml_design_system>=0.0.8']

[project.urls]
Repository = "https://github.com/cj-mills/cjm-fasthtml-keyboard-navigation"
Documentation = "https://cj-mills.github.io/cjm-fasthtml-keyboard-navigation"

[project.entry-points.nbdev]
cjm_fasthtml_keyboard_navigation = "cjm_fasthtml_keyboard_navigation._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "cjm_fasthtml_keyboard_navigation.__version__"}

[tool.setuptools.packages.find]
include = ["cjm_fasthtml_keyboard_navigation*"]

[tool.nbdev]
